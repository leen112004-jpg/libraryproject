{% extends "layouts/base.html" %}
{% block content %}
<h1>{% if student %}Edit{% else %}Add{% endif %} Student</h1>
<form method="post">
    {% csrf_token %}
    <label>Name:</label><input type="text" name="name" value="{{ student.name }}"><br>
    <label>City:</label><input type="text" name="city" value="{{ student.address.city }}"><br>
    <button type="submit">Save</button>
</form>
<a href="{% url 'books.student_list' %}">Cancel</a>
{% endblock %}
