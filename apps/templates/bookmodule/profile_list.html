{% extends "layouts/base.html" %}
{% block content %}
<h1>Profiles (with Images)</h1>
<a href="{% url 'books.profile_add' %}">Add Profile</a>
<ul>
    {% for p in profiles %}
    <li>
        {{ p.name }}
        <img src="{{ p.image.url }}" style="width:100px;">
    </li>
    {% endfor %}
</ul>
{% endblock %}
