{% extends "layouts/base.html" %}
{% load static %}

{% block title %} Delete Book {% endblock title %}

{% block content %}
<h1>Delete Book</h1>
<p>Are you sure you want to delete "{{ book.title }}" by {{ book.author }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'books.list_books' %}">Cancel</a>
{% endblock content %}
