{% extends "layouts/base.html" %}
{% load static %}

{% block title %} Delete Book (Django Forms) {% endblock title %}

{% block content %}
<h1>Delete Book (Django Forms)</h1>
<p>Are you sure you want to delete "{{ book.title }}" by {{ book.author }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'books.list_books_django' %}">Cancel</a>
{% endblock content %}
